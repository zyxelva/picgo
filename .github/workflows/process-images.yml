name: Process Images and Generate Footprints JSON

on:
  push:
    paths:
      - 'source/images/Footprint/**'
  workflow_dispatch:

jobs:
  extract-metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 如果使用默认 GITHUB_TOKEN 则需此项，若用 PAT 可省略

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_TOKEN }}   # 用 PAT 检出

      - name: Debug - list files
        run: |
          pwd
          ls -la

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install exifr

      - name: Debug - list directories
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of ./images:"
          ls -la ./images/ || echo "./images/ does not exist"
          echo "Contents of ./images/Footprint (if exists):"
          ls -la ./images/Footprint/ || echo "./images/Footprint/ does not exist"

      - name: Install dependencies   # <--- 需要添加这一步
        run: npm install

      - name: Run metadata extraction
        env:
          AMAP_API_KEY: ${{ secrets.AMAP_API_KEY }}   # 从 Secrets 读取
        run: node scripts/extract-image-metadata.js

      - name: Commit and push changes
        env:
          GIT_NAME: ${{ secrets.GIT_NAME }}
          GIT_EMAIL: ${{ secrets.GIT_EMAIL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config --global user.name "$GIT_NAME"
          git config --global user.email "$GIT_EMAIL"
          git remote set-url origin https://${GH_TOKEN}@github.com/zyxelva/picgo.git
          git add ./data/footprints.json
          git diff --staged --quiet || git commit -m "chore: auto-update footprints data from images"
          git push